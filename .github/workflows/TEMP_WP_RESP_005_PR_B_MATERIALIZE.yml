name: TEMP WP-RESP-005 PR-B materialize catalog

on:
  push:
    branches:
      - automation/wp-resp-005-pr-b-replenish-after-wp016-pr-a
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  materialize:
    if: github.event_name == 'push' || github.head_ref == 'automation/wp-resp-005-pr-b-replenish-after-wp016-pr-a'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: automation/wp-resp-005-pr-b-replenish-after-wp016-pr-a
      - name: Reconcile canonical catalog from bounded modular changes
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          root = Path('.')
          catalog_path = root / 'planning/EV4_AUTOMATION_WORK_PACKAGE_CATALOG.json'
          catalog = json.loads(catalog_path.read_text(encoding='utf-8'))
          for package_id in ('WP-RESP-016', 'WP-RESP-017', 'WP-RESP-019'):
              wrapper = json.loads((root / 'planning/work-packages' / f'{package_id}.json').read_text(encoding='utf-8'))
              if wrapper['id'] != package_id or wrapper['work_package']['id'] != package_id:
                  raise SystemExit(f'wrapper ID mismatch: {package_id}')
              catalog['work_packages'][package_id] = wrapper['work_package']
          catalog['work_packages'] = dict(sorted(catalog['work_packages'].items(), key=lambda item: int(item[0].rsplit('-', 1)[1])))
          catalog_path.write_text(json.dumps(catalog, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          status_path = root / 'STATUS.md'
          text = status_path.read_text(encoding='utf-8')
          match = None
          snapshot = None
          for candidate in re.finditer(r'```json\n(\{.*?\})\n```', text, re.S):
              try:
                  parsed = json.loads(candidate.group(1))
              except json.JSONDecodeError:
                  continue
              if parsed.get('source') == 'planning/EV4_AUTOMATION_WORK_PACKAGE_CATALOG.json':
                  match = candidate
                  snapshot = parsed
                  break
          if match is None or snapshot is None:
              raise SystemExit('STATUS catalog snapshot block not found')
          snapshot['policy'] = {
              'ready_work_package_target': 4,
              'refresh_when_ready_below': 4,
              'max_ready_work_packages': 5,
          }
          snapshot['selectable_ready_horizon'] = ['WP-RESP-011', 'WP-RESP-014', 'WP-RESP-018', 'WP-RESP-019']
          snapshot['active_work_packages'] = ['WP-RESP-016']
          completed = set(snapshot['completed_work_packages'])
          completed.add('WP-RESP-017')
          snapshot['completed_work_packages'] = sorted(completed, key=lambda value: int(value.rsplit('-', 1)[1]))
          replacement = '```json\n' + json.dumps(snapshot, ensure_ascii=False, indent=2) + '\n```'
          text = text[:match.start()] + replacement + text[match.end():]
          status_path.write_text(text, encoding='utf-8')
          PY

          python validation/e2e/run_automation_work_package_catalog_reassembly_check.py --write
          python validation/e2e/run_automation_work_package_catalog_check.py
          python validation/e2e/run_automation_work_package_catalog_reassembly_check.py --self-test
          python validation/e2e/run_automation_replenishment_policy_transition_check.py
          python validation/e2e/run_status_merged_foundation_guard_check.py
          python validation/e2e/run_automation_control_state_check.py
          python validation/e2e/run_task_quality_gate_check.py

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add planning/EV4_AUTOMATION_WORK_PACKAGE_CATALOG.json planning/EV4_AUTOMATION_WORK_PACKAGE_CATALOG_INDEX.json planning/work-packages STATUS.md
          if git diff --cached --quiet; then
            echo 'No materialization changes required.'
            exit 0
          fi
          git commit -m 'WP-RESP-005/PR-B: materialize canonical replenishment state'
          git push origin HEAD
